[project]
name = "coldchain-backend"
version = "0.1.0"
description = "MQTT-to-PostgreSQL backend for ESP32 telemetry"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "paho-mqtt>=2.1.0",
    "psycopg[binary]>=3.2.0",
    "pydantic>=2.10.0",
    "uvicorn[standard]>=0.34.0",
]

[tool.uv]
package = false
